<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART-MBTI | 藝術界生存毒舌人格測驗 (30題完整版)</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161821;
            --accent-color: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.4);
            --secondary-accent: #00e5ff;
            --text-color: #f0f3f8;
            --sub-text: #8e95a5;
            --border-color: #2a2d3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-accent));
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        p.subtitle {
            color: var(--sub-text);
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-color), #d00043);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .btn-option {
            background: #1e2130;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            text-align: left;
            padding: 16px 20px;
            margin-bottom: 12px;
            font-size: 0.98rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: block;
            width: 100%;
        }

        .btn-option:hover {
            background: #272b3f;
            border-color: var(--accent-color);
            transform: translateX(4px);
        }

        .hidden {
            display: none !important;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--sub-text);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #222536;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-accent));
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.25rem;
            margin-bottom: 22px;
            font-weight: 600;
            color: #ffffff;
        }

        .result-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .character-img-container {
            width: 100%;
            max-height: 280px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
            background-color: #0b0c10;
        }

        .character-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .result-code {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .tag-container {
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: #25293d;
            color: var(--secondary-accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        .result-desc {
            background: #1a1d2b;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-top: 15px;
            text-align: left;
        }

        .result-desc h3 {
            color: var(--accent-color);
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-desc h3:first-child {
            margin-top: 0;
        }

        .result-desc p {
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .badge-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .badge-item {
            background: #222638;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            border-left: 3px solid var(--secondary-accent);
        }

        .badge-item strong {
            display: block;
            color: #fff;
            margin-bottom: 2px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .badge-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 開始頁面 -->
    <div id="start-page">
        <h1>ART-MBTI</h1>
        <p class="subtitle">【藝術與設計界生存毒舌人格測驗 - 30題終極版】<br>涵蓋視覺藝術、平面設計、舞台劇場、產品建築！<br>測下你在呢個「用愛發電」嘅生態圈入面到底係邊種怪胎！</p>
        
        <div style="background: #1a1d2b; padding: 18px; border-radius: 12px; margin-bottom: 25px; text-align: left; font-size: 0.9rem; border-left: 4px solid var(--accent-color);">
            <p style="color: #fff; font-weight: bold; margin-bottom: 5px;">測驗須知：</p>
            <p style="color: var(--sub-text);">全劇共 30 條情境選擇題，請憑直覺回答。準備好接受無情嘅真相未？</p>
        </div>

        <button class="btn" onclick="startQuiz()">即刻入場接受現實 (30 題)</button>
    </div>

    <!-- 測驗進行頁面 -->
    <div id="quiz-page" class="hidden">
        <div class="progress-header">
            <span id="progress-text">題目 1 / 30</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="question-title" id="question-text">題目載入中...</div>
        <div id="options-container"></div>
    </div>

    <!-- 結果頁面 -->
    <div id="result-page" class="hidden">
        <div class="result-header">
            <p style="color: var(--sub-text); font-size: 0.9rem; margin-bottom: 8px;">經大數據精算，你的藝術界真身係：</p>
            <div class="result-title" id="res-title">角色名稱</div>
            <div class="result-code" id="res-code">CODE</div>
        </div>

        <div class="character-img-container">
            <img id="res-img" class="character-img" src="" alt="角色插畫">
        </div>

        <div class="tag-container" id="res-tags"></div>

        <div class="result-desc">
            <h3>🔥 毒舌真相剖析</h3>
            <p id="res-savage"></p>

            <h3>⚡ 日常生存狀態</h3>
            <p id="res-status"></p>

            <h3>🏆 藝術界生存指數</h3>
            <div class="badge-list">
                <div class="badge-item">
                    <strong>肝功能剩餘值</strong>
                    <span id="res-liver">10%</span>
                </div>
                <div class="badge-item">
                    <strong>Bank Account 警號</strong>
                    <span id="res-bank">長期赤字</span>
                </div>
            </div>

            <h3>🔮 最終歸宿 / 生存建議</h3>
            <p id="res-fate" style="margin-top: 5px;"></p>
        </div>

        <button class="btn" onclick="restartQuiz()">重新投胎 (再測一次)</button>
    </div>
</div>

<script>
const questions = [
    {
        q: "Q1. 展覽開幕 / 舞台劇首演前一日，作品 / 佈景仲未做好，你會：",
        options: [
            { text: "即時爆肝，飲三罐red bull，通宵狂做直到開幕前一分鐘。", score: "DEADLINE" },
            { text: "心諗「其實未做完都係一種藝術」，現場貼張白紙寫 Concept 算。", score: "TALK" },
            { text: "即刻打比藝發局/Funder 申請延期，順便出個post話因不可抗力因素取消。", score: "FUNDING" },
            { text: "搞唔掂，寫辭職信，準備從此於藝術圈消失。", score: "QUIT" }
        ]
    },
    {
        q: "Q2. 個客同你講：「呢個位差少少感覺，你可唔可以改一改？」",
        options: [
            { text: "咬實牙關問：「請問想要咩感覺？」，然後回家產出 Version_v99。", score: "CLIENT_SLAVE" },
            { text: "發表偉大藝術理論，用專業名詞打到對方懷疑人生不敢再改。", score: "TALK" },
            { text: "打開 Grid System，指出 1px 嘅偏差都會破壞視覺張力，堅決拒絕。", score: "GRID_FREAK" },
            { text: "默默在心中詛咒對方，順手將改稿時間加入最新 Invoice 裡面。", score: "FUNDING" }
        ]
    },
    {
        q: "Q3. 開幕 / 慶功宴上，觀眾問你：「你呢件作品想表達啲咩？」",
        options: [
            { text: "引用傅柯、德達羅斯、後現代主義，講到佢聽唔明為止。", score: "TALK" },
            { text: "微笑握手：「呢個一次關於場域與當代人性離散嘅對話，來，飲杯 Champagne！」", score: "GALLERY_PARTY" },
            { text: "「這代表咗我對當代資本主義壓迫嘅無聲抗議（其實係隨手拿廢料砌出來）。」", score: "GARBAGE_MASTER" },
            { text: "內心冷笑：「其實我只係覺得咁樣砌好睇，冇想咁多。」", score: "DEADLINE" }
        ]
    },
    {
        q: "Q4. 面對「用愛發電」（即係冇酬勞、但話可以「幫你增加 Exposure」）嘅邀請：",
        options: [
            { text: "咬牙接！「算啦，為咗藝術，Exposure 都係一種報酬……（第50次咁講）」", score: "LOVE" },
            { text: "「無問題！但我用嘅係黑衫黑褲 + 劇場廢料，你比我在後台打燈就得。」", score: "STAGE_GHOST" },
            { text: "寫一份 20 頁 Proposal 叫佢去申請政府資助，申請到先再搵我。", score: "FUNDING" },
            { text: "直接 Block 對方，並於 IG Story 發佈 500 字長文批判當代職場剝削。", score: "QUIT" }
        ]
    },
    {
        q: "Q5. 去街見到地下有舊奇怪嘅廢木、廢鐵或者廢棄紙箱，你嘅反應係：",
        options: [
            { text: "眼光發亮！即刻搬返工作室，覺得可以做下一展覽嘅 Core Piece！", score: "GARBAGE_MASTER" },
            { text: "諗緊呢舊嘢如果放喺舞台舞台燈光下，會投射出點樣嘅陰影效果。", score: "STAGE_GHOST" },
            { text: "感嘆它的 Texture 幾好，然後影相做 Moodboard 素材。", score: "GRID_FREAK" },
            { text: "繞過佢，心想：「千祈唔好俾我 Client 見到，如果唔係佢又叫我用廢料做 Design。」", score: "CLIENT_SLAVE" }
        ]
    },
    {
        q: "Q6. Client 要求你喺一張 A4 海報上面放 15 個 Sponsor Logo，仲要「全部都要大」：",
        options: [
            { text: "崩潰，但依然認命地打開 Illustrator，精確計算每個 Logo 嘅像素。", score: "CLIENT_SLAVE" },
            { text: "堅持用 0.5pt 嘅邊框同瑞士排版 Grid 把它們排列得像現代藝術品。", score: "GRID_FREAK" },
            { text: "「不如全部做成透明 Opacity 5%，這叫『隱喻式贊助』，好 Deep 㗎！」", score: "TALK" },
            { text: "直接把 Logo 縮到睇唔到，心想：「反正是曝光，印出來再算。」", score: "DEADLINE" }
        ]
    },
    {
        q: "Q7. 劇場 / 展場燈光忽然故障全黑，首演仲有 10 分鐘，你會：",
        options: [
            { text: "極速拿起膠紙同電線，冷靜衝上去 Lighting Console 盲操修復！", score: "STAGE_GHOST" },
            { text: "同觀眾講：「這正是我們設計嘅『黑暗沉浸式體驗』，請感受靜止。」", score: "TALK" },
            { text: "心跳加速到 180，邊喊邊祈禱，手速極快地重啟所有機器。", score: "DEADLINE" },
            { text: "即時拍照發 IG Story：「Art Failure Moment」，然後去喝香檳。", score: "GALLERY_PARTY" }
        ]
    },
    {
        q: "Q8. 你平日出門或者工作時，最常見嘅穿著風格係：",
        options: [
            { text: "全身黑衫黑褲 + 工具包 / Gaffer Tape，極度耐髒與隱形。", score: "STAGE_GHOST" },
            { text: "極簡三宅一生 / 全黑山本耀司風格，眼鏡一定要係圓框 / 幾何框。", score: "GRID_FREAK" },
            { text: "沾滿漆油 / 木屑嘅舊 T-shirt，充滿「工作者」嘅滄桑感。", score: "GARBAGE_MASTER" },
            { text: "時尚名牌混合獨立設計師品牌，隨時準備出席 VIP Opening。", score: "GALLERY_PARTY" }
        ]
    },
    {
        q: "Q9. 當你收到政府 / 基金會嘅拒絕信（Rejection Letter）時：",
        options: [
            { text: "即刻打開舊 Word 檔，將原本嘅 Proposal 改動 30% 關鍵字，再投另一個 Funding。", score: "FUNDING" },
            { text: "早已習慣，默默繼續用自己正職薪水「用愛發電」支持創作。", score: "LOVE" },
            { text: "「哼，評審根本不懂當代前衛藝術嘅價值！」", score: "TALK" },
            { text: "心安理得：「太好了，終於唔使做呢個 Project，可以安心考保險牌。」", score: "QUIT" }
        ]
    },
    {
        q: "Q10. 連續通宵工作 48 小時後，你身體現時嘅狀態係：",
        options: [
            { text: "靠黑咖啡同能量飲料維持心跳，眼神渙散但手指依然在動。", score: "DEADLINE" },
            { text: "「無事！只要劇場燈光一亮，我嘅腎上腺素就會爆發！」", score: "STAGE_GHOST" },
            { text: "一邊發燒一邊改稿，Client 一句「Logo 放大」差啲引發腦出血。", score: "CLIENT_SLAVE" },
            { text: "問自己第 100 次：「我做咩要讀 Art / Design？做 M 記都好過做呢度。」", score: "QUIT" }
        ]
    },
    {
        q: "Q11. 開會時，對手講咗句聽唔明嘅 Term（例如「Paradigm Shift」、「Site-specific」）：",
        options: [
            { text: "即時點頭，順著對方講出更精深嘅 Derrida 哲學名詞反制對方。", score: "TALK" },
            { text: "默默記下來，今晚寫 Grant Application 嘅時候一定要加進去。", score: "FUNDING" },
            { text: "微笑回應：「非常同意，這跟我們在 Gallery 展出嘅解構主義概念一致。」", score: "GALLERY_PARTY" },
            { text: "翻個白眼，心想：「講咁多廢話，最後咪又係要我改 Logo。」", score: "CLIENT_SLAVE" }
        ]
    },
    {
        q: "Q12. 對於「1px 嘅排版偏差」或者「舞台燈光偏咗 5cm」：",
        options: [
            { text: "絕對不能忍受！就算通宵都要將佢拉番對齊！強迫症發作！", score: "GRID_FREAK" },
            { text: "「微調 5cm 可以造成意想不到嘅陰影張力，這叫『有機嘅不完美』。」", score: "TALK" },
            { text: "拿膠紙跟螺絲批，5秒鐘內直接手動修好。", score: "STAGE_GHOST" },
            { text: "Client 睇唔睇得出？睇唔出就隨便啦，快啲 Sign-off 交稿付錢！", score: "QUIT" }
        ]
    },
    {
        q: "Q13. 展覽開幕派對（Opening Cocktail）你主要喺度做咩：",
        options: [
            { text: "穿梭於畫廊主、收藏家同贊助商之間，華麗地交換 Business Card。", score: "GALLERY_PARTY" },
            { text: "站在角落默默食免費沙律同飲免費紅酒，補充這星期嘅熱量。", score: "LOVE" },
            { text: "同人大力介紹自己下一個需要 Funding 嘅大計劃。", score: "FUNDING" },
            { text: "根本沒去，因為還喺工作室幫 Client 改緊另一份稿。", score: "CLIENT_SLAVE" }
        ]
    },
    {
        q: "Q14. 你電腦 / 工作室最常見嘅檔案命名習慣係：",
        options: [
            { text: "Poster_Final_v1_RealFinal_v99_FinalOK_Printed.ai", score: "CLIENT_SLAVE" },
            { text: "2026_HKADC_Grant_Application_Draft_v4.docx", score: "FUNDING" },
            { text: "Untitled_1_Untitled_2_Concept_Draft_01.psd", score: "DEADLINE" },
            { text: "01_BrandIdentity_GridSystem_CMYK_Master.ai", score: "GRID_FREAK" }
        ]
    },
    {
        q: "Q15. 劇本 Cue Sheet / 設計 Brief 突然完全大改，距離上台 / 交稿只剩 30 分鐘：",
        options: [
            { text: "進入無我境界，手速快過光速，在最後一秒成功 Export / 點 Cue！", score: "DEADLINE" },
            { text: "冷靜接過控制台，憑經驗跟肌肉記憶現場即興 Lighting Jamming！", score: "STAGE_GHOST" },
            { text: "心裡痛罵 Client / 導演祖宗十八代，但手指依然聽話地改稿。", score: "CLIENT_SLAVE" },
            { text: "「改唔切，不如取消，大家提早放工去飲 Beer。」", score: "QUIT" }
        ]
    },
    {
        q: "Q16. 朋友問你：「最近 busy 緊咩啊？」，你通常會答：",
        options: [
            { text: "「忙緊寫緊幾個 Funding proposal，跟住又有兩個 Residency 要 Apply。」", score: "FUNDING" },
            { text: "「咪又係嗰啲賤格 Client，改稿改到我就快死。」", score: "CLIENT_SLAVE" },
            { text: "「準備緊下個月劇場個 Show，連續三星期入館 setup。」", score: "STAGE_GHOST" },
            { text: "「最近喺度反思當代藝術嘅本質，做緊一啲概念性嘅實驗。」", score: "TALK" }
        ]
    },
    {

    "TALK": 0, "DEADLINE": 0, "LOVE": 0, "FUNDING": 0, "QUIT": 0,
    "CLIENT_SLAVE": 0, "STAGE_GHOST": 0, "GARBAGE_MASTER": 0, "GRID_FREAK": 0, "GALLERY_PARTY": 0
};

function startQuiz() {
    document.getElementById("start-page").classList.add("hidden");
    document.getElementById("quiz-page").classList.remove("hidden");
    showQuestion();
}

function showQuestion() {
    let q = questions[currentQ];
    document.getElementById("question-text").innerText = q.q;
    
    let progressPercent = Math.round(((currentQ) / questions.length) * 100);
    document.getElementById("progress-text").innerText = `題目 ${currentQ + 1} / ${questions.length}`;
    document.getElementById("progress-percent").innerText = `${progressPercent}%`;
    document.getElementById("progress").style.width = `${progressPercent}%`;

    let optionsHTML = "";
    q.options.forEach((opt) => {
        optionsHTML += `<button class="btn-option" onclick="selectOption('${opt.score}')">${opt.text}</button>`;
    });
    document.getElementById("options-container").innerHTML = optionsHTML;
}

function selectOption(scoreKey) {
    if (scores.hasOwnProperty(scoreKey)) {
        scores[scoreKey]++;
    }
    currentQ++;

    if (currentQ < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-page").classList.add("hidden");
    document.getElementById("result-page").classList.remove("hidden");

    let highestKey = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
    let res = results[highestKey];

    document.getElementById("res-title").innerText = res.title;
    document.getElementById("res-code").innerText = res.code;
    document.getElementById("res-img").src = res.img;
    document.getElementById("res-savage").innerText = res.savage;
    document.getElementById("res-status").innerText = res.status;
    document.getElementById("res-liver").innerText = res.liver;
    document.getElementById("res-bank").innerText = res.bank;
    document.getElementById("res-fate").innerText = res.fate;

    let tagsHTML = "";
    res.tags.forEach(t => {
        tagsHTML += `<span class="tag">${t}</span>`;
    });
    document.getElementById("res-tags").innerHTML = tagsHTML;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
    currentQ = 0;
    for (let k in scores) {
        scores[k] = 0;
    }
    document.getElementById("result-page").classList.add("hidden");
    document.getElementById("start-page").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
