<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝術界毒舌人格測驗 ART MBTI TEST</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #18181c;
            --accent-color: #ccff00; /* 藝術展覽常見螢光黃綠 */
            --text-color: #f0f0f0;
            --text-muted: #a0a0a0;
            --border-color: #2e2e35;
            --danger-color: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 15px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: 600;
            transform: translateY(-2px);
        }

        .btn-start {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-start:hover {
            background: #b8e600;
        }

        /* Result View Component */
        .result-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .result-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            margin-bottom: 20px;
            border: 3px solid var(--accent-color);
        }

        .result-title {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .result-quote {
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-left: 3px solid var(--accent-color);
            border-radius: 4px;
            width: 100%;
        }

        .status-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }

        .status-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1rem;
            font-weight: bold;
            color: var(--danger-color);
        }

        .details-box {
            text-align: left;
            width: 100%;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .details-box div {
            margin-bottom: 10px;
        }

        .badge {
            background: rgba(204, 255, 0, 0.1);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

            <button class="btn-start" onclick="restartTest()">再測一次 (Restart)</button>
        </div>
    </div>
</div>

// Logic Control
let currentQuestionIndex = 0;
let scores = {};

// 初始化分數
function initScores() {
    for (let key in profiles) {
        scores[key] = 0;
    }
}

function startTest() {
    initScores();
    currentQuestionIndex = 0;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('question-screen').classList.remove('hidden');
    renderQuestion();
}

function renderQuestion() {
    const qData = questions[currentQuestionIndex];
    document.getElementById('question-number').innerText = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
    document.getElementById('question-text').innerText = qData.q;
    
    // Update progress bar
    const progress = ((currentQuestionIndex) / questions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    qData.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(type) {
    if (scores[type] !== undefined) {
        scores[type] += 1;
    }

    currentQuestionIndex++;

    if (currentQuestionIndex < questions.length) {
        renderQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('question-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    // 計算得分最高的人格
    let maxScore = -1;
    let winner = "TALK-ARTIST";

    for (let key in scores) {
        if (scores[key] > maxScore) {
            maxScore = scores[key];
            winner = key;
        }
    }

    const res = profiles[winner];

    document.getElementById('res-avatar').innerText = res.avatar;
    document.getElementById('res-title').innerText = res.title;
    document.getElementById('res-quote').innerText = res.quote;
    document.getElementById('res-liver').innerText = res.liver;
    document.getElementById('res-bank').innerText = res.bank;
    document.getElementById('res-core').innerText = res.core;
    document.getElementById('res-skill').innerText = res.skill;
    document.getElementById('res-weak').innerText = res.weak;

    if (res.extra) {
        document.getElementById('res-extra-container').classList.remove('hidden');
        document.getElementById('res-extra').innerText = res.extra;
    } else {
        document.getElementById('res-extra-container').classList.add('hidden');
    }
}

function restartTest() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
}
</script>
