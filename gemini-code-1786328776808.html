let currentQuestion = 0;
let userScores = {};

function startQuiz() {
    currentQuestion = 0;
    userScores = {};
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');
    showQuestion();
}

function showQuestion() {
    const qData = questions[currentQuestion];
    document.getElementById('q-number').innerText = `QUESTION ${String(currentQuestion + 1).padStart(2, '0')}/30`;
    
    const progress = Math.round(((currentQuestion) / 30) * 100);
    document.getElementById('progress-bar').style.width = `${progress}%`;
    document.getElementById('q-progress-text').innerText = `${progress}%`;

    document.getElementById('question-text').innerText = qData.q;

    const optionsContainer = document.getElementById('options-list');
    optionsContainer.innerHTML = '';

    qData.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(type) {
    userScores[type] = (userScores[type] || 0) + 1;
    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').classList.remove('active');
    document.getElementById('result-screen').classList.add('active');

    // Calculate highest score
    let maxScore = -1;
    let finalType = "BURN-OUT"; // default fallback

    for (const [type, score] of Object.entries(userScores)) {
        if (score > maxScore) {
            maxScore = score;
            finalType = type;
        }
    }

    const resultData = profiles[finalType];

    document.getElementById('res-type-code').innerText = resultData.code;
    document.getElementById('res-title').innerText = resultData.title;
    document.getElementById('res-avatar').src = resultData.avatar;
    document.getElementById('res-quote').innerText = resultData.quote;
    document.getElementById('res-liver').innerText = resultData.liver;
    document.getElementById('res-bank').innerText = resultData.bank;
    document.getElementById('res-core').innerText = resultData.core;
    document.getElementById('res-skill').innerText = resultData.skill;
    document.getElementById('res-weakness').innerText = resultData.weakness;
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
    document.getElementById('result-screen').classList.remove('active');
    document.getElementById('start-screen').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
